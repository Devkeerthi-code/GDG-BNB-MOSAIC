spring.application.name=IME

spring.datasource.url=jdbc:postgresql://localhost:5432/ime
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

jwt.secret=9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9
jwt.expirationMs=86400000

groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.max-output-tokens=${GROQ_MAX_OUTPUT_TOKENS:256}
negotiation.max-rounds=${NEGOTIATION_MAX_ROUNDS:3}
