<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Login - IME')}"></head>
<body>
    <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; max-width: 450px;">
        <div class="card" style="width: 100%;">
            <h1 class="text-center" style="margin-bottom: 0.5rem;">Welcome Back</h1>
            <p class="text-center text-muted" style="margin-bottom: 2rem;">Sign in to your IME account</p>

            <div th:if="${param.registered}" class="alert alert-success">
                Registration successful! Please login.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                You have been logged out.
            </div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <form th:action="@{/login}" th:object="${loginRequest}" method="post">
                <div class="form-group">
                    <label for="contactNumber">Contact Number</label>
                    <input type="text" id="contactNumber" th:field="*{contactNumber}" placeholder="e.g. 9876543210" required>
                    <span th:if="${#fields.hasErrors('contactNumber')}" th:errors="*{contactNumber}" style="color: var(--danger); font-size: 0.75rem;"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="••••••••" required>
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: var(--danger); font-size: 0.75rem;"></span>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
            </form>
            
            <p class="text-center mt-4">
                Don't have an account? <a th:href="@{/register}" style="color: var(--accent); text-decoration: none;">Register here</a>
            </p>
        </div>
    </div>
</body>
</html>
